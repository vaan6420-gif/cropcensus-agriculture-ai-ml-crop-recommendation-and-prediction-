<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title">
  <title id="title">Friendly farmer avatar</title>
  <defs>
    <style>
      .waving-arm {
        transform-box: view-box;
        transform-origin: 108px 128px;
        animation: farmer-wave 2.8s ease-in-out .4s infinite;
      }

      @keyframes farmer-wave {
        0%, 62%, 100% { transform: rotate(0deg); }
        70% { transform: rotate(-9deg); }
        78% { transform: rotate(4deg); }
        86% { transform: rotate(-8deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .waving-arm { animation: none; }
      }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f8d9"/>
      <stop offset="1" stop-color="#9fce72"/>
    </linearGradient>
    <linearGradient id="shirt" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#5a9a60"/>
      <stop offset=".55" stop-color="#34744b"/>
      <stop offset="1" stop-color="#20573a"/>
    </linearGradient>
    <linearGradient id="skin" x1=".15" y1=".1" x2=".8" y2=".9">
      <stop offset="0" stop-color="#ffd79b"/>
      <stop offset=".65" stop-color="#efa967"/>
      <stop offset="1" stop-color="#d8874e"/>
    </linearGradient>
    <linearGradient id="hat" x1=".1" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffe187"/>
      <stop offset=".5" stop-color="#f4b947"/>
      <stop offset="1" stop-color="#d88b2d"/>
    </linearGradient>
    <radialGradient id="shine" cx=".28" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".24"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="avatar">
      <circle cx="80" cy="80" r="77"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar)">
    <circle cx="80" cy="80" r="80" fill="url(#sky)"/>
    <circle cx="126" cy="35" r="13" fill="#fff5c7" opacity=".8"/>
    <path d="M0 111c20-17 35-20 54-9 18 10 34 9 51-2 19-12 37-8 55 5v55H0z" fill="#6ba85a"/>
    <path d="M0 131c22-14 40-12 59-2 21 11 38 10 57-1 16-9 30-7 44 1v31H0z" fill="#4d914e"/>
    <path d="M17 130c9-19 20-21 29-19-9 4-13 12-15 24m99-11c6-18 17-22 26-19-9 4-13 12-14 23" fill="none" stroke="#a9d879" stroke-linecap="round" stroke-width="4"/>
    <ellipse cx="80" cy="151" rx="46" ry="12" fill="#234e37" opacity=".24"/>
    <g filter="url(#shadow)">
      <path d="M33 164c2-29 17-46 47-46s45 17 47 46z" fill="url(#shirt)"/>
      <path d="M66 112h28v22c-7 9-21 9-28 0z" fill="url(#skin)"/>
      <path d="M48 72c0-25 13-39 32-39s32 14 32 39v19c0 20-14 34-32 34S48 111 48 91z" fill="url(#skin)"/>
      <path d="M50 79c6-2 11-7 15-15 12 9 28 12 45 9v20c0 19-13 32-30 32S50 112 50 93z" fill="url(#shine)" opacity=".34"/>
      <path d="M61 84c4-4 9-4 13 0m13 0c4-4 9-4 13 0" fill="none" stroke="#69432e" stroke-linecap="round" stroke-width="3"/>
      <ellipse cx="68" cy="91" rx="2.5" ry="3.5" fill="#3c372d"/>
      <ellipse cx="96" cy="91" rx="2.5" ry="3.5" fill="#3c372d"/>
      <path d="M72 105c5 7 13 9 20 0" fill="none" stroke="#9e4f3e" stroke-linecap="round" stroke-width="3"/>
      <path d="M47 72c1-23 13-37 33-37s32 14 33 37c-8-7-13-15-16-22-12 13-29 19-50 22z" fill="url(#hat)"/>
      <path d="M42 70c9-9 24-13 39-13s30 4 39 13c-7 9-21 13-39 13S49 79 42 70z" fill="#e4a43d"/>
      <path d="M48 68c11-6 22-8 33-8s22 2 33 8" fill="none" stroke="#fff0b0" stroke-linecap="round" stroke-width="3" opacity=".8"/>
      <path d="M48 80c6 4 12 6 19 7m45-7c-5 4-10 6-16 7" fill="none" stroke="#d88b2d" stroke-linecap="round" stroke-width="2" opacity=".65"/>
      <g class="waving-arm">
        <path d="M101 124c8-8 17-11 25-16l7-29c1-5 5-7 9-5 4 2 3 6 2 10l-4 18c3-4 7-5 10-2 2 3-1 7-4 11 4-3 8-2 9 2 1 4-2 7-6 10 2 4-1 8-6 9l-13 1c-8 8-17 13-29 13z" fill="url(#skin)"/>
        <path d="M101 125c5-7 12-10 20-14l11-3-3 16c-6 8-14 14-24 18l-11-8z" fill="url(#shirt)"/>
        <path d="M130 79c1-5 5-7 9-5 4 2 3 6 2 10l-1 6m5 12c3-4 7-5 10-2 2 3-1 7-4 11m-2 0c4-3 8-2 9 2 1 4-2 7-6 10" fill="none" stroke="#ffe0ad" stroke-linecap="round" stroke-width="2" opacity=".8"/>
      </g>
      <path d="M51 137c9 5 19 8 29 8s20-3 29-8" fill="none" stroke="#8ac276" stroke-linecap="round" stroke-width="3" opacity=".65"/>
    </g>
    <circle cx="80" cy="80" r="77" fill="none" stroke="#fff" stroke-opacity=".62" stroke-width="3"/>
  </g>
</svg>
